<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>J.A.R.V.I.S.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: #030812; 
      color: #00d2ff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; 
      min-height: 100vh;
      min-height: 100dvh; 
      padding: 30px 20px calc(25px + env(safe-area-inset-bottom)); 
      overflow: hidden; 
    }
    .hud-header { text-align: center; }
    .hud-title { font-size: 26px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 15px rgba(0,210,255,0.8); }
    .hud-status { font-size: 11px; letter-spacing: 2px; color: #00ff88; margin-top: 5px; }
    .arc-reactor-container { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
    .ring { position: absolute; border-radius: 50%; border: 2px dashed rgba(0,210,255,0.4); }
    .ring-outer { width: 175px; height: 175px; animation: spin 20s linear infinite; }
    .ring-inner { width: 130px; height: 130px; border-style: solid; border-color: rgba(0,210,255,0.2) transparent; animation: spin-rev 10s linear infinite; }
    .core { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #00d2ff 0%, #030812 70%); box-shadow: 0 0 30px #00d2ff; display: flex; align-items: center; justify-content: center; }
    .listening .core { animation: pulse 1s infinite alternate; background: radial-gradient(circle, #ff0055 0%, #030812 70%); box-shadow: 0 0 35px #ff0055; }
    .response-box { width: 100%; max-height: 140px; overflow-y: auto; background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.4; color: #e0f7ff; text-align: center; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .btn-mic { width: 66px; height: 66px; border-radius: 50%; background: #001f3f; border: 2px solid #00d2ff; color: #00d2ff; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,210,255,0.4); cursor: pointer; }
    .text-row { display: flex; width: 100%; gap: 8px; }
    .input-text { flex: 1; background: rgba(0,210,255,0.1); border: 1px solid rgba(0,210,255,0.3); border-radius: 8px; color: #fff; padding: 10px 12px; font-size: 15px; outline: none; }
    .btn-send { background: #00d2ff; border: none; border-radius: 8px; color: #030812; font-weight: bold; padding: 0 16px; font-size: 14px; cursor: pointer; }
    .btn-settings { background: transparent; border: none; color: rgba(0,210,255,0.5); font-size: 11px; letter-spacing: 1px; padding: 4px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div class="hud-header">
    <div class="hud-title">J.A.R.V.I.S.</div>
    <div class="hud-status" id="status">INITIALISIERE...</div>
  </div>

  <div class="arc-reactor-container" id="reactor">
    <div class="ring ring-outer"></div>
    <div class="ring ring-inner"></div>
    <div class="core"></div>
  </div>

  <div class="response-box" id="output">Verbinde Gehirn mit Google...</div>

  <div class="controls">
    <button class="btn-mic" id="micBtn">🎙️</button>
    <div class="text-row">
      <input type="text" id="textPrompt" class="input-text" placeholder="Befehl an Jarvis...">
      <button class="btn-send" onclick="sendTypedText()">SEND</button>
    </div>
    <button class="btn-settings" onclick="setApiKey()">API-KEY ÄNDERN</button>
  </div>

  <script>
    let apiKey = (localStorage.getItem('gemini_api_key') || '').trim();
    let detectedModel = null;

    function setApiKey() {
      const key = prompt('Bitte gib deinen Gemini API-Key ein:', apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        initBrain();
      }
    }

    if (!apiKey) setTimeout(setApiKey, 600);
    else initBrain();

    // Fragt Google direkt: Welche Modelle darf dieser Key nutzen?
    async function initBrain() {
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      if (!apiKey) return;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`);
        const data = await res.json();
        if (data.models && data.models.length > 0) {
          const valid = data.models.filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent'));
          const chosen = valid.find(m => m.name.includes('flash')) || valid[0];
          detectedModel = chosen.name;
          status.innerText = 'ONLINE // ' + detectedModel.replace('models/', '').toUpperCase();
          output.innerText = 'Bereit, Sir. Sprich mit mir oder schreibe einen Befehl.';
        } else if (data.error) {
          status.innerText = 'KEY UNGÜLTIG';
          output.innerText = 'Google-Fehler: ' + data.error.message;
        }
      } catch (e) {
        status.innerText = 'VERBINDUNGSLÜCKE';
        output.innerText = 'Konnte Google nicht erreichen: ' + e.message;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.onstart = () => {
        document.getElementById('reactor').classList.add('listening');
        document.getElementById('status').innerText = 'ICH HÖRE ZU...';
      };
      recognition.onend = () => {
        document.getElementById('reactor').classList.remove('listening');
      };
      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('output').innerText = `Du: "${text}"`;
        await askJarvis(text);
      };
      recognition.onerror = () => {
        document.getElementById('status').innerText = 'BEREIT';
      };
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      if (!apiKey) return setApiKey();
      if (!recognition) {
        alert('Spracheingabe wird im Browser blockiert. Bitte nutze das Textfeld unten!');
        return;
      }
      try { recognition.start(); } catch(e) { recognition.stop(); }
    });

    function sendTypedText() {
      const input = document.getElementById('textPrompt');
      const val = input.value.trim();
      if (val) {
        document.getElementById('output').innerText = `Du: "${val}"`;
        askJarvis(val);
        input.value = '';
      }
    }

    async function askJarvis(promptText) {
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      status.innerText = 'VERARBEITE...';

      if (!apiKey) return setApiKey();
      const modelToUse = detectedModel || 'models/gemini-2.0-flash';
      const systemPrompt = "Du bist J.A.R.V.I.S., ein loyaler, hochintelligenter Assistent. Antworte auf Deutsch präzise und nenne mich Sir.";

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/${modelToUse}:generateContent?key=${apiKey}`;
        const response = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemPrompt}\n\nNutzer: ${promptText}` }] }]
          })
        });

        const data = await response.json();
        if (data.error) {
          output.innerText = `Google-Fehler: ${data.error.message}`;
          status.innerText = 'FEHLER';
          return;
        }

        const reply = data.candidates[0].content.parts[0].text;
        output.innerText = reply;
        status.innerText = 'BEREIT';
        speak(reply);

      } catch (err) {
        output.innerText = 'Fehler: ' + err.message;
        status.innerText = 'FEHLER';
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.pitch = 0.9;
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
