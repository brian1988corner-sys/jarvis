<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>J.A.R.V.I.S. 2.5</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { 
      background-color: #030812; 
      color: #00d2ff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: space-between; 
      min-height: 100vh;
      min-height: 100dvh; 
      padding: 30px 20px calc(25px + env(safe-area-inset-bottom)); 
      overflow: hidden; 
    }
    .hud-header { text-align: center; }
    .hud-title { font-size: 24px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 15px rgba(0,210,255,0.8); }
    .hud-status { font-size: 11px; letter-spacing: 2px; color: #00ff88; margin-top: 5px; }
    .arc-reactor-container { position: relative; width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
    .ring { position: absolute; border-radius: 50%; border: 2px dashed rgba(0,210,255,0.4); }
    .ring-outer { width: 175px; height: 175px; animation: spin 20s linear infinite; }
    .ring-inner { width: 130px; height: 130px; border-style: solid; border-color: rgba(0,210,255,0.2) transparent; animation: spin-rev 10s linear infinite; }
    .core { width: 80px; height: 80px; border-radius: 50%; background: radial-gradient(circle, #00d2ff 0%, #030812 70%); box-shadow: 0 0 30px #00d2ff; display: flex; align-items: center; justify-content: center; }
    .listening .core { animation: pulse 1s infinite alternate; background: radial-gradient(circle, #ff0055 0%, #030812 70%); box-shadow: 0 0 35px #ff0055; }
    .response-box { width: 100%; max-height: 140px; overflow-y: auto; background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.4; color: #e0f7ff; text-align: center; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 10px; width: 100%; }
    .btn-mic { width: 66px; height: 66px; border-radius: 50%; background: #001f3f; border: 2px solid #00d2ff; color: #00d2ff; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,210,255,0.4); cursor: pointer; }
    .text-row { display: flex; width: 100%; gap: 8px; }
    .input-text { flex: 1; background: rgba(0,210,255,0.1); border: 1px solid rgba(0,210,255,0.3); border-radius: 8px; color: #fff; padding: 10px 12px; font-size: 15px; outline: none; }
    .btn-send { background: #00d2ff; border: none; border-radius: 8px; color: #030812; font-weight: bold; padding: 0 16px; font-size: 14px; cursor: pointer; }
    .btn-settings { background: transparent; border: none; color: rgba(0,210,255,0.5); font-size: 11px; letter-spacing: 1px; padding: 4px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div class="hud-header">
    <div class="hud-title">J.A.R.V.I.S. 2.5</div>
    <div class="hud-status" id="status">SYSTEM ONLINE // BEREIT</div>
  </div>

  <div class="arc-reactor-container" id="reactor">
    <div class="ring ring-outer"></div>
    <div class="ring ring-inner"></div>
    <div class="core"></div>
  </div>

  <div class="response-box" id="output">Bereit für Ihren Befehl, Sir.</div>

  <div class="controls">
    <button class="btn-mic" id="micBtn">🎙️</button>
    <div class="text-row">
      <input type="text" id="textPrompt" class="input-text" placeholder="Befehl an Jarvis...">
      <button class="btn-send" onclick="sendTypedText()">SEND</button>
    </div>
    <button class="btn-settings" onclick="setApiKey()">API-KEY ÄNDERN</button>
  </div>

  <script>
    let apiKey = (localStorage.getItem('gemini_api_key') || '').trim();
    let bestModel = localStorage.getItem('jarvis_best_model') || 'gemini-2.5-flash';

    function setApiKey() {
      const key = prompt('Bitte gib deinen Gemini API-Key ein:', apiKey);
      if (key !== null) {
        apiKey = key.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        alert('Key gespeichert!');
      }
    }

    if (!apiKey) setTimeout(setApiKey, 600);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.interimResults = false;
      recognition.onstart = () => {
        document.getElementById('reactor').classList.add('listening');
        document.getElementById('status').innerText = 'ICH HÖRE ZU...';
      };
      recognition.onend = () => {
        document.getElementById('reactor').classList.remove('listening');
      };
      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('output').innerText = `Du: "${text}"`;
        await askJarvis(text);
      };
      recognition.onerror = () => {
        document.getElementById('status').innerText = 'BEREIT';
      };
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      if (!apiKey) return setApiKey();
      if (!recognition) return alert('Spracheingabe nicht verfügbar. Bitte tippen!');
      try { recognition.start(); } catch(e) { recognition.stop(); }
    });

    function sendTypedText() {
      const input = document.getElementById('textPrompt');
      const val = input.value.trim();
      if (val) {
        document.getElementById('output').innerText = `Du: "${val}"`;
        askJarvis(val);
        input.value = '';
      }
    }

    async function askJarvis(promptText) {
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      status.innerText = 'DENKE NACH...';

      if (!apiKey) return setApiKey();

      // Strikt kurze und saubere Antworten für maximale Sprachgeschwindigkeit
      const systemPrompt = "Du bist J.A.R.V.I.S., der hochentwickelte KI-Assistent. Antworte immer auf Deutsch, professionell, charmant und in maximal 1 bis 2 kurzen Sätzen. Sprich mich gelegentlich mit Sir an. Verwende absolut KEINE Formatierungszeichen wie Sternchen (*), Rautenzeichen (#) oder Aufzählungen, da deine Antworten direkt laut vorgelesen werden.";

      const modelsToTry = [bestModel, 'gemini-2.5-flash', 'gemini-3.8-flash', 'gemini-3.5-flash-lite'];
      // Dopplungen entfernen
      const uniqueModels = [...new Set(modelsToTry)];

      for (const m of uniqueModels) {
        try {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: `${systemPrompt}\n\nNutzer: ${promptText}` }] }]
            })
          });

          const data = await response.json();

          if (data.candidates && data.candidates.length > 0) {
            const reply = data.candidates[0].content.parts[0].text;
            // Erfolgreiches Modell für immer abspeichern -> ab jetzt 0 Sek Verzögerung!
            if (bestModel !== m) {
              bestModel = m;
              localStorage.setItem('jarvis_best_model', m);
            }
            output.innerText = reply;
            status.innerText = 'BEREIT';
            speakCleanText(reply);
            return;
          }
        } catch (e) {
          // Nächstes probieren falls nötig
        }
      }

      output.innerText = 'Verbindung fehlgeschlagen.';
      status.innerText = 'FEHLER';
    }

    function speakCleanText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      // Sonderzeichen und Markdown-Sterne entfernen, damit die Stimme flüssig spricht
      const clean = text.replace(/[*#_~`>]/g, '').trim();

      const utterance = new SpeechSynthesisUtterance(clean);
      utterance.lang = 'de-DE';
      utterance.rate = 1.05; // Natürlicheres Tempo
      utterance.pitch = 1.0;

      // Sucht gezielt nach hochwertigen / Siri-Stimmen auf dem iPhone
      const voices = window.speechSynthesis.getVoices();
      const germanVoices = voices.filter(v => v.lang.startsWith('de'));
      
      const premiumVoice = germanVoices.find(v => 
        v.name.includes('Siri') || 
        v.name.includes('Enhanced') || 
        v.name.includes('Premium') ||
        v.name.includes('Anna')
      ) || germanVoices[0];

      if (premiumVoice) utterance.voice = premiumVoice;

      window.speechSynthesis.speak(utterance);
    }

    // Stimmen auf iOS vorladen
    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }
  </script>
</body>
</html>
