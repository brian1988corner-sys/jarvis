<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>J.A.R.V.I.S.</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #030812; color: #00d2ff; display: flex; flex-direction: column; align-items: center; justify-content: space-between; height: 100vh; padding: 40px 20px; overflow: hidden; }
    .hud-header { text-align: center; }
    .hud-title { font-size: 26px; font-weight: 800; letter-spacing: 4px; text-shadow: 0 0 15px rgba(0,210,255,0.8); }
    .hud-status { font-size: 11px; letter-spacing: 2px; color: #00ff88; margin-top: 5px; }
    .arc-reactor-container { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
    .ring { position: absolute; border-radius: 50%; border: 2px dashed rgba(0,210,255,0.4); }
    .ring-outer { width: 210px; height: 210px; animation: spin 20s linear infinite; }
    .ring-inner { width: 160px; height: 160px; border-style: solid; border-color: rgba(0,210,255,0.2) transparent; animation: spin-rev 10s linear infinite; }
    .core { width: 100px; height: 100px; border-radius: 50%; background: radial-gradient(circle, #00d2ff 0%, #030812 70%); box-shadow: 0 0 30px #00d2ff; display: flex; align-items: center; justify-content: center; }
    .listening .core { animation: pulse 1s infinite alternate; background: radial-gradient(circle, #ff0055 0%, #030812 70%); box-shadow: 0 0 35px #ff0055; }
    .response-box { width: 100%; max-height: 140px; overflow-y: auto; background: rgba(0, 210, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.2); border-radius: 12px; padding: 12px; font-size: 14px; line-height: 1.4; color: #e0f7ff; text-align: center; }
    .controls { display: flex; flex-direction: column; align-items: center; gap: 15px; width: 100%; }
    .btn-mic { width: 75px; height: 75px; border-radius: 50%; background: #001f3f; border: 2px solid #00d2ff; color: #00d2ff; font-size: 28px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 20px rgba(0,210,255,0.4); cursor: pointer; }
    .btn-settings { background: transparent; border: none; color: rgba(0,210,255,0.5); font-size: 12px; letter-spacing: 1px; }
    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes spin-rev { 100% { transform: rotate(-360deg); } }
    @keyframes pulse { 0% { transform: scale(0.95); } 100% { transform: scale(1.1); } }
  </style>
</head>
<body>
  <div class="hud-header">
    <div class="hud-title">J.A.R.V.I.S.</div>
    <div class="hud-status" id="status">SYSTEM ONLINE // BEREIT</div>
  </div>

  <div class="arc-reactor-container" id="reactor">
    <div class="ring ring-outer"></div>
    <div class="ring ring-inner"></div>
    <div class="core"></div>
  </div>

  <div class="response-box" id="output">Tippe auf das Mikrofon und sprich mit mir, Sir.</div>

  <div class="controls">
    <button class="btn-mic" id="micBtn">🎙️</button>
    <button class="btn-settings" onclick="setApiKey()">API-KEY ÄNDERN</button>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_api_key') || '';
    let memory = JSON.parse(localStorage.getItem('jarvis_memory') || '[]');

    function setApiKey() {
      const key = prompt('Bitte gib deinen Gemini API-Key ein:', apiKey);
      if (key) {
        apiKey = key.trim();
        localStorage.setItem('gemini_api_key', apiKey);
        alert('Key gespeichert!');
      }
    }

    if (!apiKey) setTimeout(setApiKey, 500);

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'de-DE';
      recognition.onstart = () => {
        document.getElementById('reactor').classList.add('listening');
        document.getElementById('status').innerText = 'ICH HÖRE ZU...';
      };
      recognition.onend = () => {
        document.getElementById('reactor').classList.remove('listening');
        document.getElementById('status').innerText = 'VERARBEITE...';
      };
      recognition.onresult = async (event) => {
        const text = event.results[0][0].transcript;
        document.getElementById('output').innerText = `Du: "${text}"`;
        await askJarvis(text);
      };
    } else {
      alert('Spracherkennung wird im Browser nicht unterstützt. Bitte als PWA zum Homescreen hinzufügen!');
    }

    document.getElementById('micBtn').addEventListener('click', () => {
      if (!apiKey) return setApiKey();
      try { recognition.start(); } catch(e) { recognition.stop(); }
    });

    async function askJarvis(promptText) {
      const status = document.getElementById('status');
      const output = document.getElementById('output');
      
      const systemInstruction = `Du bist J.A.R.V.I.S., ein loyaler, hochintelligenter persönlicher Assistent. Antworte präzise, professionell auf Deutsch und sprich den Nutzer mit "Sir" an. Halte Antworten für die Sprachausgabe mundgerecht und kurz. Dein bisheriges Gedächtnis: ${JSON.stringify(memory)}`;

      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: `${systemInstruction}\n\nNutzer: ${promptText}` }] }]
          })
        });

        const data = await response.json();
        const reply = data.candidates[0].content.parts[0].text;
        output.innerText = reply;
        status.innerText = 'SYSTEM ONLINE // BEREIT';

        if (promptText.toLowerCase().includes('merke') || promptText.toLowerCase().includes('erinnere')) {
          memory.push({ date: new Date().toLocaleDateString(), note: promptText });
          localStorage.setItem('jarvis_memory', JSON.stringify(memory));
        }

        speak(reply);
      } catch (err) {
        output.innerText = 'Fehler: ' + err.message;
        status.innerText = 'VERBINDUNGSFEHLER';
      }
    }

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'de-DE';
        utterance.pitch = 0.9;
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }
  </script>
</body>
</html>
